# Bundled openai API-equivalent price card.
# Evidence and date policy: docs/research/openai-model-pricing-2026-10-16.md
# Current rate only; earlier price history not established. Web-search capability not established; no tool-rate assertion.
schema_version = 1

[model]
provider = "openai"
id = "gpt-rosalind-discovery"

[[schedules]]
effective_from = "2026-10-16"
basis = "api_equivalent"
currency = "USD"
source_url = "https://developers.openai.com/api/docs/pricing"
source_retrieved_at = "2026-10-16"

[[schedules.rates]]
meter = "input_tokens"
unit = "million_tokens"
price = "5"

[[schedules.rates]]
meter = "cached_input_tokens"
unit = "million_tokens"
price = "0.5"

[[schedules.rates]]
meter = "output_tokens"
unit = "million_tokens"
price = "25"
